components:
  schemas:
    AnswerResource:
      description: A completed question always includes its name, including null when unnamed.
      discriminator:
        mapping:
          choice: '#/components/schemas/AnswerResourceChoice'
          predicate: '#/components/schemas/AnswerResourcePredicate'
          refusal: '#/components/schemas/AnswerResourceRefusal'
          score: '#/components/schemas/AnswerResourceScore'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/AnswerResourcePredicate'
      - $ref: '#/components/schemas/AnswerResourceChoice'
      - $ref: '#/components/schemas/AnswerResourceScore'
      - $ref: '#/components/schemas/AnswerResourceRefusal'
      x-oai-discriminator-values:
      - predicate
      - choice
      - score
      - refusal
    AnswerResourceChoice:
      additionalProperties: false
      properties:
        choice:
          $ref: '#/components/schemas/ChoiceValueResource'
        confidence:
          type: number
        name:
          minLength:
            $serde_json::private::Number: '0'
          type:
          - string
          - 'null'
        probabilities:
          items:
            $ref: '#/components/schemas/ChoiceProbabilityResource'
          maxItems:
            $serde_json::private::Number: '2000'
          minItems:
            $serde_json::private::Number: '0'
          type: array
        type:
          default: choice
          description: The type of the object. Always `choice`.
          enum:
          - choice
          type: string
          x-stainless-const: true
      required:
      - type
      - name
      - choice
      - probabilities
      - confidence
      type: object
    AnswerResourcePredicate:
      additionalProperties: false
      properties:
        name:
          minLength:
            $serde_json::private::Number: '0'
          type:
          - string
          - 'null'
        probability:
          type: number
        type:
          default: predicate
          description: The type of the object. Always `predicate`.
          enum:
          - predicate
          type: string
          x-stainless-const: true
      required:
      - type
      - name
      - probability
      type: object
    AnswerResourceRefusal:
      additionalProperties: false
      description: The model declined to answer this question. Other questions in the same request can still receive answers.
      properties:
        name:
          minLength:
            $serde_json::private::Number: '0'
          type:
          - string
          - 'null'
        type:
          default: refusal
          description: The type of the object. Always `refusal`.
          enum:
          - refusal
          type: string
          x-stainless-const: true
      required:
      - type
      - name
      type: object
    AnswerResourceScore:
      additionalProperties: false
      properties:
        confidence:
          type: number
        name:
          minLength:
            $serde_json::private::Number: '0'
          type:
          - string
          - 'null'
        probabilities:
          items:
            $ref: '#/components/schemas/ScoreProbabilityResource'
          maxItems:
            $serde_json::private::Number: '2000'
          minItems:
            $serde_json::private::Number: '0'
          type: array
        score:
          type: number
        type:
          default: score
          description: The type of the object. Always `score`.
          enum:
          - score
          type: string
          x-stainless-const: true
      required:
      - type
      - name
      - score
      - probabilities
      - confidence
      type: object
    ChoiceOptionParam:
      additionalProperties: false
      properties:
        description:
          maxLength:
            $serde_json::private::Number: '1048576'
          minLength:
            $serde_json::private::Number: '0'
          type: string
        value:
          $ref: '#/components/schemas/ChoiceValueParam'
      required:
      - value
      type: object
    ChoiceProbabilityResource:
      additionalProperties: false
      properties:
        probability:
          type: number
        value:
          $ref: '#/components/schemas/ChoiceValueResource'
      required:
      - value
      - probability
      type: object
    ChoiceValueParam:
      description: 'Choice values are typed: a string and a boolean with the same text are distinct.'
      oneOf:
      - maxLength:
          $serde_json::private::Number: '1048576'
        minLength:
          $serde_json::private::Number: '0'
        type: string
      - type: boolean
    ChoiceValueResource:
      description: 'Choice values are typed: a string and a boolean with the same text are distinct.'
      oneOf:
      - minLength:
          $serde_json::private::Number: '0'
        type: string
      - type: boolean
    DecisionInput:
      description: The input to evaluate for every question. Provide a text string or an ordered array of messages, function calls and outputs, or custom tool calls and outputs. Each tool output must identify a matching call by call ID.
      oneOf:
      - maxLength:
          $serde_json::private::Number: '10485760'
        minLength:
          $serde_json::private::Number: '0'
        type: string
      - items:
          discriminator:
            mapping:
              custom_tool_call: '#/components/schemas/DecisionInputCustomToolCall'
              custom_tool_call_output: '#/components/schemas/DecisionInputCustomToolCallOutput'
              function_call: '#/components/schemas/DecisionInputFunctionCall'
              function_call_output: '#/components/schemas/DecisionInputFunctionCallOutput'
              message: '#/components/schemas/DecisionInputMessage'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/DecisionInputMessage'
          - $ref: '#/components/schemas/DecisionInputFunctionCall'
          - $ref: '#/components/schemas/DecisionInputFunctionCallOutput'
          - $ref: '#/components/schemas/DecisionInputCustomToolCall'
          - $ref: '#/components/schemas/DecisionInputCustomToolCallOutput'
          x-oai-default-discriminator-value: message
          x-oai-discriminator-values:
          - message
          - function_call
          - function_call_output
          - custom_tool_call
          - custom_tool_call_output
        maxItems:
          $serde_json::private::Number: '131072'
        minItems:
          $serde_json::private::Number: '0'
        type: array
    DecisionInputAssistantContent:
      description: A text string or an ordered list of output text and refusal parts.
      oneOf:
      - maxLength:
          $serde_json::private::Number: '10485760'
        minLength:
          $serde_json::private::Number: '0'
        type: string
      - $ref: '#/components/schemas/DecisionInputAssistantContentParts'
        title: Parts
    DecisionInputAssistantContentParts:
      items:
        discriminator:
          mapping:
            output_text: '#/components/schemas/DecisionInputOutputText'
            refusal: '#/components/schemas/DecisionInputRefusal'
          propertyName: type
        oneOf:
        - $ref: '#/components/schemas/DecisionInputOutputText'
        - $ref: '#/components/schemas/DecisionInputRefusal'
        x-oai-discriminator-values:
        - output_text
        - refusal
      maxItems:
        $serde_json::private::Number: '16384'
      minItems:
        $serde_json::private::Number: '0'
      type: array
    DecisionInputAssistantMessage:
      additionalProperties: false
      description: An assistant message containing output text or refusals.
      properties:
        content:
          $ref: '#/components/schemas/DecisionInputAssistantContent'
        phase:
