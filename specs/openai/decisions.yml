info:
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  description: The OpenAI REST API. Please see https://platform.openai.com/docs/api-reference for more details.
  license:
    identifier: MIT
    name: MIT
  termsOfService: https://openai.com/policies/terms-of-use
  title: OpenAI API
  version: 2.3.0
openapi: 3.1.0
paths:
  /decisions:
    post:
      description: Use this endpoint to quickly answer classification or scoring questions about some input. You can ask multiple questions in one request.
      operationId: createDecision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
          description: The answers and token usage.
      summary: Create a decision
      tags:
      - Decisions
      x-oaiMeta:
        examples:
          request:
            curl: |
              curl https://api.openai.com/v1/decisions \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $OPENAI_API_KEY" \
                -d '{
                  "model": "gpt-6-luna",
                  "input": "The package arrived with a broken screen.",
                  "questions": [
                    {
                      "type": "predicate",
                      "name": "damaged",
                      "instructions": "Does the customer report a damaged item?"
                    }
                  ]
                }'
          response: |
            {
              "model": "gpt-6-luna",
              "answers": [
                {"type": "predicate", "name": "damaged", "probability": 0.95}
              ],
              "usage": {
                "input_tokens": 42,
                "input_tokens_details": {"cached_tokens": 0, "cache_write_tokens": 0},
                "output_tokens": 0,
                "output_tokens_details": {"reasoning_tokens": 0},
                "total_tokens": 42
              }
            }
        group: decisions
servers:
- url: https://api.openai.com/v1
