      minItems:
        $serde_json::private::Number: '0'
      type: array
    DecisionInputCustomToolCall:
      additionalProperties: false
      properties:
        call_id:
          maxLength:
            $serde_json::private::Number: '64'
          minLength:
            $serde_json::private::Number: '1'
          type: string
        id:
