          minLength:
            $serde_json::private::Number: '1'
          pattern: ^[a-zA-Z0-9_.-]+$
          type: string
        namespace:
          maxLength:
            $serde_json::private::Number: '64'
          minLength:
            $serde_json::private::Number: '1'
          pattern: ^[a-zA-Z0-9_-]+$
          type:
          - string
          - 'null'
        status:
          anyOf:
          - $ref: '#/components/schemas/FunctionCallStatusParam'
