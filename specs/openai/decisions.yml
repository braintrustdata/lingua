      - developer
      - system
      - assistant
    DecisionInputOutputText:
      additionalProperties: false
      properties:
        text:
          maxLength:
            $serde_json::private::Number: '10485760'
          minLength:
            $serde_json::private::Number: '0'
          type: string
        type:
          default: output_text
          enum:
          - output_text
          type: string
          x-stainless-const: true
