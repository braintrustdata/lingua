        type:
          default: message
          enum:
          - message
          type: string
          x-stainless-const: true
      required:
      - role
      - content
      type: object
    DecisionInputContent:
      description: A text string or an ordered list of text, image, and JSON parts.
      oneOf:
      - maxLength:
