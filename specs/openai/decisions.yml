    DecisionRequest:
      additionalProperties: false
      properties:
        input:
          $ref: '#/components/schemas/DecisionInput'
        model:
          description: The model to use. Only `gpt-6-luna` is supported.
          maxLength:
            $serde_json::private::Number: '1048576'
          minLength:
            $serde_json::private::Number: '0'
          type: string
        prompt_cache_key:
          description: Partition prompt cache reuse by caller-provided key.
          maxLength:
            $serde_json::private::Number: '64'
          minLength:
            $serde_json::private::Number: '0'
          type:
          - string
          - 'null'
        prompt_cache_options:
          additionalProperties: false
          description: Options for prompt caching. Supported for `gpt-5.6` and later models. By default, OpenAI automatically chooses one implicit cache breakpoint. You can add explicit breakpoints to content blocks with `prompt_cache_breakpoint`. Each request can write up to four breakpoints. For cache matching, OpenAI considers up to the latest 80 breakpoints in the conversation, without a content-block lookback limit. Set `mode` to `explicit` to disable the implicit breakpoint. The `ttl` defaults to `30m`, which is currently the only supported value. See the [prompt caching guide](https://developers.openai.com/api/docs/guides/prompt-caching) for current details.
          properties:
            mode:
              description: Controls whether OpenAI automatically creates an implicit cache breakpoint. Defaults to `implicit`. With `implicit`, OpenAI creates one implicit breakpoint and writes up to the latest three explicit breakpoints in the request. With `explicit`, OpenAI does not create an implicit breakpoint and writes up to the latest four explicit breakpoints. If there are no explicit breakpoints, the request does not use prompt caching.
              enum:
              - implicit
              - explicit
              - null
              type:
              - string
              - 'null'
            ttl:
              default: 30m
              description: The minimum lifetime applied to every implicit and explicit cache breakpoint written by the request. Defaults to `30m`, which is currently the only supported value. The backend may retain cache entries for longer.
              enum:
              - 30m
              type: string
              x-stainless-const: true
          title: Prompt cache options
          type:
          - object
          - 'null'
        questions:
          description: Ask 1–400 questions about the input. Each question can be a predicate, choice, or score. Answers come back in the same order.
          items:
            $ref: '#/components/schemas/QuestionParam'
          maxItems:
