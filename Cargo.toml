[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/braintrustdata/lingua"

[workspace.dependencies]
# Internal
lingua = { path = "crates/lingua", version = "0.1.0" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
# Use wrapper crate to isolate arbitrary_precision feature from downstream crates
big_serde_json = { path = "serde_json" }
serde_json = "1.0"
yaml_serde = "0.10.6"
serde_with = "3.14.1"
indexmap = { version = "2", features = ["serde"] }
ts-rs = { version = "11.0", features = ["serde-compat", "no-serde-warnings"] }
anyhow = "1.0"
thiserror = "2.0"
regex = "1"

# Schema generation
typify = "0.5"
schemars = "0.8"
syn = "2"
prettyplease = "0.2"

# Optional providers
aws-sdk-bedrockruntime = { version = "1.148.0", default-features = false }

# URL and media handling
url = "2.5"
urlencoding = "2.1"
base64 = "0.22"
ipnet = "2.11"

# Bytes
bytes = "1"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "RequestMode", "Response", "Headers"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

# Native HTTP client (non-WASM only)
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "form"] }
reqwest-middleware = { version = "0.5.2" }
reqwest-retry = { version = "0.9.1" }

# Python
pyo3 = { version = "0.24.1", features = ["extension-module"] }

# Dev
tokio-test = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
paste = "1.0"
log = "0.4"
env_logger = "0.11"

# ============================================================================
# Dependencies for braintrust-llm-router
# ============================================================================

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
async-trait = "0.1"
futures = "0.3"

# HTTP
http = "1.1"

# Utilities
rand = { version = "0.10.4", features = ["std"] }
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "6.2.1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11.1"

# AWS (for Bedrock provider)
aws-sigv4 = { version = "1.4.3" }
aws-credential-types = { version = "1.2.14" }
aws-smithy-runtime-api = { version = "1.12.0" }
aws-smithy-eventstream = { version = "0.61.4" }

# Auth
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }

# Tracing (optional)
tracing = { version = "0.1" }

# Router dev dependencies
wiremock = "0.6.5"
proptest = "1.4"
criterion = { version = "0.5", features = ["async_tokio"] }
pretty_assertions = "1.4"
tempfile = "3.10"
tokio-stream = "0.1"
dotenv = "0.15"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[profile.bench]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
