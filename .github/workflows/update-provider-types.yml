name: Update provider types

on:
  schedule:
    # 09:00 PST / 10:00 PDT
    - cron: "0 17 * * 1"
    - cron: "0 17 * * 2"
    - cron: "0 17 * * 3"
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to update"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - openai
          - anthropic
          - google

concurrency:
  group: update-provider-types
  cancel-in-progress: false

permissions: {}

jobs:
  provider_matrix:
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.providers.outputs.providers }}

    steps:
      - name: Parse provider input
        id: providers
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PROVIDER: ${{ inputs.provider || 'all' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              "0 17 * * 1")
                provider="openai"
                ;;
              "0 17 * * 2")
                provider="anthropic"
                ;;
              "0 17 * * 3")
                provider="google"
                ;;
              *)
                echo "Unknown provider update schedule: $SCHEDULE" >&2
                exit 1
                ;;
            esac
          else
            provider="$REQUESTED_PROVIDER"
          fi

          case "$provider" in
            all)
              providers='["openai","anthropic","google"]'
              ;;
            openai|anthropic|google)
              providers="[\"$provider\"]"
              ;;
            *)
              echo "Unknown provider: $provider" >&2
              exit 1
              ;;
          esac

          echo "providers=$providers" >> "$GITHUB_OUTPUT"
          echo "Will update providers: $providers"

  propose:
    needs: provider_matrix
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.provider_matrix.outputs.providers) }}
    steps:
      - name: Checkout immutable workflow source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Build isolated updater image before using credentials
        run: node .github/scripts/provider-type-update-isolation.mjs build

      - name: Generate proposal in an isolated container
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          PROVIDER: ${{ matrix.provider }}
        run: node .github/scripts/provider-type-update-isolation.mjs propose "$PROVIDER" "$RUNNER_TEMP/proposal"

      - name: Upload sanitized proposal records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-type-proposal-${{ matrix.provider }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/proposal/proposal.patch
            ${{ runner.temp }}/proposal/metadata.json
            ${{ runner.temp }}/proposal/plan.json
            ${{ runner.temp }}/proposal/verification.json
            ${{ runner.temp }}/proposal/report.json
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: [provider_matrix, propose]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.provider_matrix.outputs.providers) }}
    steps:
      - name: Checkout immutable validation source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download proposal from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provider-type-proposal-${{ matrix.provider }}-${{ github.run_id }}
          path: ${{ runner.temp }}/proposal

      - name: Check for a proposal
        id: proposal
        run: |
          if [ -s "$RUNNER_TEMP/proposal/proposal.patch" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.proposal.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Build isolated validation image
        if: steps.proposal.outputs.present == 'true'
        run: node .github/scripts/provider-type-update-isolation.mjs build

      - name: Validate proposal without application secrets
        if: steps.proposal.outputs.present == 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
        run: node .github/scripts/provider-type-update-isolation.mjs validate "$PROVIDER" "$RUNNER_TEMP/validation" "$RUNNER_TEMP/proposal"

      - name: Upload sanitized validation records
        if: steps.proposal.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-type-validation-${{ matrix.provider }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/validation/validation.json
            ${{ runner.temp }}/validation/report.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [provider_matrix, propose, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.provider_matrix.outputs.providers) }}
    steps:
      - name: Checkout immutable publication source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Download proposal from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provider-type-proposal-${{ matrix.provider }}-${{ github.run_id }}
          path: ${{ runner.temp }}/proposal

      - name: Check for a proposal
        id: proposal
        run: |
          if [ -s "$RUNNER_TEMP/proposal/proposal.patch" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download validation from this run
        if: steps.proposal.outputs.present == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provider-type-validation-${{ matrix.provider }}-${{ github.run_id }}
          path: ${{ runner.temp }}/validation

      # No candidate code, builds, package installation, local actions, shared
      # caches, hooks, or user-supplied commands may execute in this job.
      - name: Recheck artifact identity and patch policy for publication
        id: publication
        if: steps.proposal.outputs.present == 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
        run: node .github/scripts/provider-type-update-publish.mjs "$PROVIDER" "$RUNNER_TEMP/proposal" "$RUNNER_TEMP/validation"

      - name: Create continuation draft
        id: create_pr
        if: steps.publication.outputs.has_changes == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
        with:
          token: ${{ github.token }}
          base: main
          branch: update-${{ matrix.provider }}-provider-types-${{ github.run_id }}
          commit-message: "Update ${{ matrix.provider }} provider types"
          title: "[Needs review] Update ${{ matrix.provider }} provider types"
          body-path: ${{ runner.temp }}/provider-type-update-pr-body.md
          draft: true

      - name: Retry continuation draft publication
        if: steps.create_pr.outcome == 'failure'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
        with:
          token: ${{ github.token }}
          base: main
          branch: update-${{ matrix.provider }}-provider-types-${{ github.run_id }}
          commit-message: "Update ${{ matrix.provider }} provider types"
          title: "[Needs review] Update ${{ matrix.provider }} provider types"
          body-path: ${{ runner.temp }}/provider-type-update-pr-body.md
          draft: true
