name: Update provider types

on:
  schedule:
    # 09:00 PST / 10:00 PDT
    - cron: "0 17 * * 1"
    - cron: "0 17 * * 2"
    - cron: "0 17 * * 3"
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to update"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - openai
          - anthropic
          - google

concurrency:
  group: update-provider-types
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  provider_matrix:
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.providers.outputs.providers }}

    steps:
      - name: Parse provider input
        id: providers
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PROVIDER: ${{ inputs.provider || 'all' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              "0 17 * * 1")
                provider="openai"
                ;;
              "0 17 * * 2")
                provider="anthropic"
                ;;
              "0 17 * * 3")
                provider="google"
                ;;
              *)
                echo "Unknown provider update schedule: $SCHEDULE" >&2
                exit 1
                ;;
            esac
          else
            provider="$REQUESTED_PROVIDER"
          fi

          case "$provider" in
            all)
              providers='["openai","anthropic","google"]'
              ;;
            openai|anthropic|google)
              providers="[\"$provider\"]"
              ;;
            *)
              echo "Unknown provider: $provider" >&2
              exit 1
              ;;
          esac

          echo "providers=$providers" >> "$GITHUB_OUTPUT"
          echo "Will update providers: $providers"

  update-provider-types:
    needs: provider_matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.provider_matrix.outputs.providers) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.0

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ripgrep
          make install-wasm-tools
          npm install -g braintrust || echo "::warning::Failed to install Braintrust SDK; parent trace setup will be skipped"
          pnpm install \
            --filter @lingua/quicktype-toolchain \
            --filter @braintrust/lingua-wasm... \
            --filter @braintrust/payload-capture... \
            --frozen-lockfile

      - name: Create Braintrust workflow trace
        id: braintrust_trace
        continue-on-error: true
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_PROJECT: lingua-provider-type-updates
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          NODE_PATH="$(npm root -g)" node .github/scripts/braintrust-provider-types.mjs create-workflow-trace

      - name: Update provider specifications and types
        id: generate
        continue-on-error: true
        run: |
          set -o pipefail
          log_path="$RUNNER_TEMP/provider-type-generation.log"
          : > "$log_path"

          set +e
          {
            echo
            echo "## Updating ${{ matrix.provider }}"
            ./pipelines/generate-provider-types.sh "${{ matrix.provider }}"
          } 2>&1 | tee -a "$log_path"
          generate_status="${PIPESTATUS[0]}"
          set -e

          echo "log_path=$log_path" >> "$GITHUB_OUTPUT"
          exit "$generate_status"

      - name: Retry provider update after partial generation
        id: retry
        if: steps.generate.outcome == 'failure'
        continue-on-error: true
        run: |
          set -o pipefail
          log_path="$RUNNER_TEMP/provider-type-generation.retry.log"
          : > "$log_path"

          set +e
          {
            echo
            echo "## Retrying ${{ matrix.provider }} after the initial generator pass"
            ./pipelines/generate-provider-types.sh "${{ matrix.provider }}"
          } 2>&1 | tee -a "$log_path"
          retry_status="${PIPESTATUS[0]}"
          set -e

          echo "log_path=$log_path" >> "$GITHUB_OUTPUT"
          exit "$retry_status"

      - name: Snapshot Braintrust trace for repair
        id: repair_task_trace
        if: >-
          steps.generate.outcome == 'failure' &&
          steps.retry.outcome == 'failure'
        continue-on-error: true
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_PROJECT: lingua-provider-type-updates
          BRAINTRUST_PARENT_SPAN_ID: ${{ steps.braintrust_trace.outputs.span_id }}
          BRAINTRUST_ROOT_SPAN_ID: ${{ steps.braintrust_trace.outputs.root_span_id }}
          PROVIDER: ${{ matrix.provider }}
          TRACE_PHASE: repair failed generation
        run: |
          set -euo pipefail
          NODE_PATH="$(npm root -g)" node .github/scripts/braintrust-provider-types.mjs create-task-trace

      - name: Load repair messages from Braintrust
        id: repair_messages
        if: >-
          steps.generate.outcome == 'failure' &&
          steps.retry.outcome == 'failure'
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_PROJECT: lingua-provider-type-updates
          PROMPT_PHASE: repair
          PROVIDER: ${{ matrix.provider }}
          GENERATION_LOG_PATH: ${{ steps.retry.outputs.log_path }}
        run: |
          set -euo pipefail
          NODE_PATH="$(npm root -g)" node .github/scripts/braintrust-provider-types.mjs load-action-messages

      - name: Repair failed generation
        id: repair
        if: >-
          steps.generate.outcome == 'failure' &&
          steps.retry.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 30
        uses: ./.github/actions/claude-code-with-retry
        env:
          APPEND_SYSTEM_PROMPT: ${{ steps.repair_messages.outputs.system_message }}
        with:
          anthropic_api_key: ${{ secrets.BRAINTRUST_API_KEY }}
          github_token: ${{ github.token }}
          display_report: "false"
          retry_on_failure: "false"
          plugin_marketplaces: |
            https://github.com/braintrustdata/braintrust-claude-plugin.git
          plugins: |
            trace-claude-code@braintrust-claude-plugin
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://gateway.staging.braintrust.dev",
                "ANTHROPIC_CUSTOM_HEADERS": "x-bt-project-name: automations-spend-control",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.BRAINTRUST_API_KEY }}",
                "TRACE_TO_BRAINTRUST": "${{ (steps.repair_task_trace.outputs.root_span_id != '' || steps.braintrust_trace.outputs.root_span_id != '') && 'true' || 'false' }}",
                "BRAINTRUST_CC_PROJECT": "lingua-provider-type-updates",
                "BRAINTRUST_API_KEY": "${{ secrets.BRAINTRUST_API_KEY }}",
                "CC_PARENT_SPAN_ID": "${{ steps.repair_task_trace.outputs.span_id || steps.braintrust_trace.outputs.span_id }}",
                "CC_ROOT_SPAN_ID": "${{ steps.repair_task_trace.outputs.root_span_id || steps.braintrust_trace.outputs.root_span_id }}",
                "BRAINTRUST_DEBUG": "false"
              }
            }
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,LS,Bash,WebSearch,WebFetch,Edit,Write"
            --disallowedTools "MultiEdit,Replace,NotebookEditCell,mcp__github__create_issue,mcp__github__create_issue_comment,mcp__github__update_issue,mcp__github__create_pr,mcp__github__create_or_update_file,mcp__github__delete_file,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
          prompt: ${{ steps.repair_messages.outputs.user_message }}

      - name: Re-run provider update after repair
        id: repair_retry
        if: steps.repair.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -o pipefail
          log_path="$RUNNER_TEMP/provider-type-generation.repair.log"
          : > "$log_path"

          {
            echo
            echo "## Updating ${{ matrix.provider }}"
            ./pipelines/generate-provider-types.sh "${{ matrix.provider }}"
          } 2>&1 | tee -a "$log_path"

          exit "${PIPESTATUS[0]}"

      - name: Generate TypeScript types
        id: ts_types
        continue-on-error: true
        run: make generate-types PROVIDER="${{ matrix.provider }}"

      - name: Build branch name
        id: branch
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short=8 HEAD)
          echo "name=update-${{ matrix.provider }}-provider-types-${short_sha}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in provider types"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "Changes detected:"
          git status --short

      - name: Snapshot Braintrust trace for integration planning
        id: integration_plan_task_trace
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_PROJECT: lingua-provider-type-updates
          BRAINTRUST_PARENT_SPAN_ID: ${{ steps.braintrust_trace.outputs.span_id }}
          BRAINTRUST_ROOT_SPAN_ID: ${{ steps.braintrust_trace.outputs.root_span_id }}
          PROVIDER: ${{ matrix.provider }}
          TRACE_PHASE: plan generated provider integration
        run: |
          set -euo pipefail
          NODE_PATH="$(npm root -g)" node .github/scripts/braintrust-provider-types.mjs create-task-trace

      - name: Plan generated provider integration
        id: integration_plan
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        timeout-minutes: 30
        uses: ./.github/actions/claude-code-with-retry
        with:
          anthropic_api_key: ${{ secrets.BRAINTRUST_API_KEY }}
          github_token: ${{ github.token }}
          display_report: "false"
          retry_on_failure: "false"
          plugin_marketplaces: |
            https://github.com/braintrustdata/braintrust-claude-plugin.git
          plugins: |
            trace-claude-code@braintrust-claude-plugin
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://gateway.staging.braintrust.dev",
                "ANTHROPIC_CUSTOM_HEADERS": "x-bt-project-name: automations-spend-control",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.BRAINTRUST_API_KEY }}",
                "TRACE_TO_BRAINTRUST": "${{ (steps.integration_plan_task_trace.outputs.root_span_id != '' || steps.braintrust_trace.outputs.root_span_id != '') && 'true' || 'false' }}",
                "BRAINTRUST_CC_PROJECT": "lingua-provider-type-updates",
                "BRAINTRUST_API_KEY": "${{ secrets.BRAINTRUST_API_KEY }}",
                "CC_PARENT_SPAN_ID": "${{ steps.integration_plan_task_trace.outputs.span_id || steps.braintrust_trace.outputs.span_id }}",
                "CC_ROOT_SPAN_ID": "${{ steps.integration_plan_task_trace.outputs.root_span_id || steps.braintrust_trace.outputs.root_span_id }}",
                "PROVIDER_UPDATE_PLAN_PATH": "${{ runner.temp }}/provider-type-update-plan.json",
                "BRAINTRUST_DEBUG": "false"
              }
            }
          claude_args: |
            --model claude-opus-5
            --effort medium
            --max-turns 50
            --add-dir "${{ runner.temp }}"
            --tools "Agent,Skill,Read,Glob,Grep,LS,Bash,Write"
            --allowedTools "Agent,Skill,Read,Glob,Grep,LS,Write,Bash(git diff:*),Bash(git status:*),Bash(git show:*)"
            --disallowedTools "Edit,WebSearch,WebFetch,MultiEdit,Replace,NotebookEditCell,mcp__github__create_issue,mcp__github__create_issue_comment,mcp__github__update_issue,mcp__github__create_pr,mcp__github__create_or_update_file,mcp__github__delete_file,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
          prompt: |
            This is the planning-only phase for provider `${{ matrix.provider }}`.
            Invoke the `provider-type-update` skill and follow its planning phase.

            First invoke only `@provider-spec-auditor`. Have it reduce the raw
            specification and generated-code diff into a compact inventory of
            wire-shape and public-type semantic changes. It must group repeated
            schema churn and separate documentation, ordering, example, and
            formatting-only changes from behavior changes.

            If that inventory contains semantic changes, invoke
            `@provider-capability-auditor`, `@provider-semantic-auditor`, and
            `@provider-coverage-auditor` in parallel with only the relevant
            semantic groups. They must not independently re-audit the complete
            raw specification diff. If the inventory contains no semantic
            changes, skip those three auditors.

            Do not modify any tracked file. Read
            `.github/scripts/provider-type-update-plan.mjs` and its tests for the
            exact schema. Write only the final JSON plan to
            `$PROVIDER_UPDATE_PLAN_PATH`. Use one plan item per semantic change
            group rather than one item per repeated schema occurrence. Exclude
            documentation-only and mechanically equivalent changes from the
            plan, but record the evidence used to classify them.
            When there are no semantic changes, use an empty `changes` array,
            put the grouped evidence in `non_semantic_changes`, and summarize
            why the other three audits were skipped in their `audit_reports`
            entries.
            Shared automation infrastructure is outside the scope of an automated
            provider update. Do not include `.github/**`, `pipelines/**`,
            `scripts/**`, `Makefile`, or `AGENTS.md` in implementation targets.
            Provider type generation fixes belong in `crates/generate-types`.

            Treat any provider semantic without a non-lossy universal
            representation as blocked and ask for a canonical representation
            decision. Never plan a `provider_options` marker or other opaque
            round-trip-only field. Audit generated public type names for upstream
            naming collisions and internal prefixes; do not accept a prefixed
            fallback such as `V1Main...` as a compatibility solution.
            Separate deterministic generator and public-name compatibility work
            from provider-semantic decisions. A generated-name normalization or
            collision repair must be its own unblocked change id even when the
            provider field using that type needs a human canonical-representation
            decision. Do not place both concerns under one blocker.

            For every blocked change, fill the complete blocker schema with the
            decision question, concrete evidence, a recommended option,
            alternatives and their tradeoffs, likely affected files, and exact
            validation commands. The workflow renders this information directly
            into a draft PR for the human who finishes the update.
            Every payload case declared by an unblocked change is automatically
            live-captured and transform-captured to keep fixtures synchronized,
            even when additional live evidence is not semantically required.
            Use `live_capture.cases` only for additional capture-only evidence.

            Write the JSON file before responding. Your final response must be
            exactly `Wrote provider update plan.` Do not print the plan, auditor
            reports, diffs, or any other analysis in the final response.

      - name: Validate integration plan
        id: plan_validation
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          plan_path="$RUNNER_TEMP/provider-type-update-plan.json"
          node .github/scripts/provider-type-update-plan.mjs validate-structure "$plan_path" "${{ matrix.provider }}"
          has_blockers=$(
            node .github/scripts/provider-type-update-plan.mjs has-blockers \
              "$plan_path" "${{ matrix.provider }}"
          )
          echo "has_blockers=$has_blockers" >> "$GITHUB_OUTPUT"
          echo "digest=$(sha256sum "$plan_path" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Stage validated plan for implementation
        id: stage_plan
        if: >-
          steps.changes.outputs.has_changes == 'true' &&
          steps.plan_validation.outcome == 'success'
        continue-on-error: true
        run: cp "$RUNNER_TEMP/provider-type-update-plan.json" plan.md

      - name: Snapshot Braintrust trace for implementation
        id: integration_implementation_task_trace
        if: steps.stage_plan.outcome == 'success'
        continue-on-error: true
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_PROJECT: lingua-provider-type-updates
          BRAINTRUST_PARENT_SPAN_ID: ${{ steps.braintrust_trace.outputs.span_id }}
          BRAINTRUST_ROOT_SPAN_ID: ${{ steps.braintrust_trace.outputs.root_span_id }}
          PROVIDER: ${{ matrix.provider }}
          TRACE_PHASE: implement generated provider integration
        run: |
          set -euo pipefail
          NODE_PATH="$(npm root -g)" node .github/scripts/braintrust-provider-types.mjs create-task-trace

      - name: Implement generated provider integration
        id: integration_implementation
        if: steps.stage_plan.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        uses: ./.github/actions/claude-code-with-retry
        with:
          anthropic_api_key: ${{ secrets.BRAINTRUST_API_KEY }}
          github_token: ${{ github.token }}
          display_report: "false"
          retry_on_failure: "false"
          plugin_marketplaces: |
            https://github.com/braintrustdata/braintrust-claude-plugin.git
          plugins: |
            trace-claude-code@braintrust-claude-plugin
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://gateway.staging.braintrust.dev",
                "ANTHROPIC_CUSTOM_HEADERS": "x-bt-project-name: automations-spend-control",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.BRAINTRUST_API_KEY }}",
                "TRACE_TO_BRAINTRUST": "${{ (steps.integration_implementation_task_trace.outputs.root_span_id != '' || steps.braintrust_trace.outputs.root_span_id != '') && 'true' || 'false' }}",
                "BRAINTRUST_CC_PROJECT": "lingua-provider-type-updates",
                "BRAINTRUST_API_KEY": "${{ secrets.BRAINTRUST_API_KEY }}",
                "CC_PARENT_SPAN_ID": "${{ steps.integration_implementation_task_trace.outputs.span_id || steps.braintrust_trace.outputs.span_id }}",
                "CC_ROOT_SPAN_ID": "${{ steps.integration_implementation_task_trace.outputs.root_span_id || steps.braintrust_trace.outputs.root_span_id }}",
                "BRAINTRUST_DEBUG": "false"
              }
            }
          claude_args: |
            --model claude-opus-5
            --max-turns 100
            --tools "Skill,Read,Glob,Grep,LS,Edit,Write,Bash"
            --allowedTools "Skill,Read,Glob,Grep,LS,Edit,Write,Bash(cargo test:*),Bash(cargo check:*),Bash(cargo clippy:*),Bash(cargo fmt:*),Bash(make generate-provider-types:*),Bash(make generate-types:*),Bash(make test-payloads:*),Bash(make typed-boundary-check:*),Bash(git diff:*),Bash(git status:*)"
            --disallowedTools "Agent,WebSearch,WebFetch,MultiEdit,Replace,NotebookEditCell,mcp__github__create_issue,mcp__github__create_issue_comment,mcp__github__update_issue,mcp__github__create_pr,mcp__github__create_or_update_file,mcp__github__delete_file,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
          prompt: |
            This is the implementation phase for provider `${{ matrix.provider }}`.
            Invoke the `provider-type-update` skill and follow its implementation
            phase. Read and implement the validated plan in `plan.md`.

            Implement every unblocked plan item, including focused tests and
            payload cases. Treat every change id listed in `plan.md`'s
            `blockers` array as out of scope: do not implement it, add a fixture
            for it, or invent a workaround. Do not edit `plan.md`, `AGENTS.md`, or any
            `generated.rs` file directly,
            `.github/**`, `pipelines/**`, `scripts/**`, or `Makefile`, and do not
            call a live provider API. Never add a `provider_options` marker or
            another opaque field solely to replay a provider semantic. If the
            universal model cannot represent a field non-lossily, stop without
            implementing that plan item. Resolve generated public-name collisions
            in `crates/generate-types`; do not accept internal prefixes such as
            `V1Main...` in exported Rust or TypeScript names.
            Public-name normalization and collision repairs are deterministic
            generator work and must be completed through their separate unblocked
            plan items without implementing any blocked semantic mapping.

            If you change `crates/generate-types`, run
            `make generate-provider-types PROVIDER=${{ matrix.provider }}` so the
            generated Rust reflects the generator fix. Changes to `generated.rs`
            are allowed only when produced by that command. Before finishing, run
            focused provider and generator tests plus clippy for every crate you
            changed. Do not report completion while a permitted deterministic
            validation is failing. Leave the completed changes uncommitted. Keep
            the final response to one sentence and do not include diffs, logs, or
            test output.

      - name: Remove staged implementation plan
        if: always() && steps.stage_plan.outcome == 'success'
        run: rm -f plan.md

      - name: Revalidate immutable integration plan
        id: post_implementation_plan
        if: steps.stage_plan.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_PLAN_DIGEST: ${{ steps.plan_validation.outputs.digest }}
        run: |
          set -euo pipefail
          plan_path="$RUNNER_TEMP/provider-type-update-plan.json"
          node .github/scripts/provider-type-update-plan.mjs validate-structure "$plan_path" "${{ matrix.provider }}"
          actual_digest=$(sha256sum "$plan_path" | awk '{print $1}')
          test "$actual_digest" = "$EXPECTED_PLAN_DIGEST"

      - name: Regenerate Rust provider types after implementation
        id: post_implementation_provider_types
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: make generate-provider-types PROVIDER="${{ matrix.provider }}"

      - name: Enforce provider update path policy
        id: path_policy
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          changes=$(git status --porcelain -- \
            .github \
            ':(glob)**/AGENTS.md' \
            Makefile \
            pipelines \
            scripts)
          if [ -n "$changes" ]; then
            echo "::error::Automated provider updates must not modify shared automation infrastructure"
            printf '%s\n' "$changes"
            exit 1
          fi
          echo "Provider update path policy passed."

      - name: Enforce provider semantic policy
        id: semantic_policy
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail

          provider_option_additions=$(
            git diff --unified=0 -- crates/lingua/src/providers |
              rg '^\+[^+].*provider_options' || true
          )
          if [ -n "$provider_option_additions" ]; then
            echo "::error::Automated provider updates must not add provider_options round-trip plumbing"
            printf '%s\n' "$provider_option_additions"
            exit 1
          fi

          if [ "${{ matrix.provider }}" = "google" ]; then
            prefixed_public_names=$(
              git diff --unified=0 -- \
                crates/lingua/src/providers/google/generated.rs \
                bindings/typescript/src/generated/google |
                rg '^\+[^+].*(pub (struct|enum|type) V1(Main|main)|Option<V1(Main|main)|Vec<V1(Main|main)|from "\./V1(Main|main))' ||
                true
            )
            if [ -n "$prefixed_public_names" ]; then
              echo "::error::Generated Google public API leaks an internal V1Main schema prefix"
              printf '%s\n' "$prefixed_public_names"
              exit 1
            fi
          fi

          echo "Provider semantic policy passed."

      - name: Regenerate TypeScript types after implementation
        id: post_implementation_ts_types
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: make generate-types PROVIDER="${{ matrix.provider }}"

      - name: Format code
        id: fmt
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: cargo fmt --all

      - name: Run focused provider tests
        id: provider_tests
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: cargo test -p lingua "${{ matrix.provider }}"

      - name: Run generator tests
        id: generator_tests
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- crates/generate-types)" ]; then
            echo "Generator sources are unchanged; no generator tests required."
            exit 0
          fi
          cargo test -p generate-types

      - name: Validate build
        id: build
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo build --all-features

      - name: Run clippy
        id: clippy
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Snapshot Braintrust trace for mechanical repair
        id: mechanical_repair_task_trace
        if: >-
          steps.changes.outputs.has_changes == 'true' &&
          (
            steps.post_implementation_provider_types.outcome != 'success' ||
            steps.semantic_policy.outcome != 'success' ||
            steps.post_implementation_ts_types.outcome != 'success' ||
            steps.fmt.outcome != 'success' ||
            steps.provider_tests.outcome != 'success' ||
            steps.generator_tests.outcome != 'success' ||
            steps.build.outcome != 'success' ||
            steps.clippy.outcome != 'success'
          )
        continue-on-error: true
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_PROJECT: lingua-provider-type-updates
          BRAINTRUST_PARENT_SPAN_ID: ${{ steps.braintrust_trace.outputs.span_id }}
          BRAINTRUST_ROOT_SPAN_ID: ${{ steps.braintrust_trace.outputs.root_span_id }}
          PROVIDER: ${{ matrix.provider }}
          TRACE_PHASE: repair deterministic provider validation
        run: |
          set -euo pipefail
          NODE_PATH="$(npm root -g)" node .github/scripts/braintrust-provider-types.mjs create-task-trace

      - name: Repair deterministic provider validation
        id: mechanical_repair
        if: steps.mechanical_repair_task_trace.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 30
        uses: ./.github/actions/claude-code-with-retry
        with:
          anthropic_api_key: ${{ secrets.BRAINTRUST_API_KEY }}
          github_token: ${{ github.token }}
          display_report: "false"
          retry_on_failure: "false"
          plugin_marketplaces: |
            https://github.com/braintrustdata/braintrust-claude-plugin.git
          plugins: |
            trace-claude-code@braintrust-claude-plugin
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://gateway.staging.braintrust.dev",
                "ANTHROPIC_CUSTOM_HEADERS": "x-bt-project-name: automations-spend-control",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.BRAINTRUST_API_KEY }}",
                "TRACE_TO_BRAINTRUST": "${{ (steps.mechanical_repair_task_trace.outputs.root_span_id != '' || steps.braintrust_trace.outputs.root_span_id != '') && 'true' || 'false' }}",
                "BRAINTRUST_CC_PROJECT": "lingua-provider-type-updates",
                "BRAINTRUST_API_KEY": "${{ secrets.BRAINTRUST_API_KEY }}",
                "CC_PARENT_SPAN_ID": "${{ steps.mechanical_repair_task_trace.outputs.span_id || steps.braintrust_trace.outputs.span_id }}",
                "CC_ROOT_SPAN_ID": "${{ steps.mechanical_repair_task_trace.outputs.root_span_id || steps.braintrust_trace.outputs.root_span_id }}",
                "PROVIDER_UPDATE_PLAN_PATH": "${{ runner.temp }}/provider-type-update-plan.json",
                "BRAINTRUST_DEBUG": "false"
              }
            }
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --add-dir "${{ runner.temp }}"
            --tools "Skill,Read,Glob,Grep,LS,Edit,Write,Bash"
            --allowedTools "Skill,Read,Glob,Grep,LS,Edit,Write,Bash(cargo test:*),Bash(cargo check:*),Bash(cargo build:*),Bash(cargo clippy:*),Bash(cargo fmt:*),Bash(make generate-provider-types:*),Bash(make generate-types:*),Bash(git diff:*),Bash(git status:*)"
            --disallowedTools "Agent,WebSearch,WebFetch,MultiEdit,Replace,NotebookEditCell,mcp__github__create_issue,mcp__github__create_issue_comment,mcp__github__update_issue,mcp__github__create_pr,mcp__github__create_or_update_file,mcp__github__delete_file,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
          prompt: |
            This is a single bounded mechanical repair pass for provider
            `${{ matrix.provider }}`. Read `$PROVIDER_UPDATE_PLAN_PATH` and the
            current diff. Fix only deterministic validation failures in already
            unblocked implementation work. Every change id in the plan's
            `blockers` array remains out of scope; do not implement it or invent
            a workaround.

            Initial validation outcomes:
            - Rust provider regeneration: `${{ steps.post_implementation_provider_types.outcome }}`
            - path policy: `${{ steps.path_policy.outcome }}`
            - semantic policy: `${{ steps.semantic_policy.outcome }}`
            - TypeScript regeneration: `${{ steps.post_implementation_ts_types.outcome }}`
            - formatting: `${{ steps.fmt.outcome }}`
            - provider tests: `${{ steps.provider_tests.outcome }}`
            - generator tests: `${{ steps.generator_tests.outcome }}`
            - build: `${{ steps.build.outcome }}`
            - clippy: `${{ steps.clippy.outcome }}`

            Re-run failed commands to obtain their exact diagnostics, then make
            the smallest durable repair. Do not edit generated Rust directly;
            repair `crates/generate-types` and run
            `make generate-provider-types PROVIDER=${{ matrix.provider }}`.
            Do not modify `plan.md`, `.github/**`, `pipelines/**`, `scripts/**`,
            `Makefile`, or `AGENTS.md`. Do not call live provider APIs. Finish by
            rerunning the focused commands you repaired. Leave changes
            uncommitted. Keep the final response to one sentence and do not
            include diffs, logs, or test output.

      - name: Regenerate Rust provider types after mechanical repair
        id: post_repair_provider_types
        if: always() && steps.mechanical_repair.outcome != 'skipped'
        continue-on-error: true
        run: make generate-provider-types PROVIDER="${{ matrix.provider }}"

      - name: Recheck provider update path policy
        id: post_repair_path_policy
        if: always() && steps.mechanical_repair.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -euo pipefail
          changes=$(git status --porcelain -- \
            .github \
            ':(glob)**/AGENTS.md' \
            Makefile \
            pipelines \
            scripts)
          if [ -n "$changes" ]; then
            echo "::error::Automated provider updates must not modify shared automation infrastructure"
            printf '%s\n' "$changes"
            exit 1
          fi
          echo "Provider update path policy passed."

      - name: Recheck provider semantic policy
        id: post_repair_semantic_policy
        if: always() && steps.mechanical_repair.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -euo pipefail

          provider_option_additions=$(
            git diff --unified=0 -- crates/lingua/src/providers |
              rg '^\+[^+].*provider_options' || true
          )
          if [ -n "$provider_option_additions" ]; then
            echo "::error::Automated provider updates must not add provider_options round-trip plumbing"
            printf '%s\n' "$provider_option_additions"
            exit 1
          fi

          if [ "${{ matrix.provider }}" = "google" ]; then
            prefixed_public_names=$(
              git diff --unified=0 -- \
                crates/lingua/src/providers/google/generated.rs \
                bindings/typescript/src/generated/google |
                rg '^\+[^+].*(pub (struct|enum|type) V1(Main|main)|Option<V1(Main|main)|Vec<V1(Main|main)|from "\./V1(Main|main))' ||
                true
            )
            if [ -n "$prefixed_public_names" ]; then
              echo "::error::Generated Google public API leaks an internal V1Main schema prefix"
              printf '%s\n' "$prefixed_public_names"
              exit 1
            fi
          fi

          echo "Provider semantic policy passed."

      - name: Regenerate TypeScript types after mechanical repair
        id: post_repair_ts_types
        if: always() && steps.mechanical_repair.outcome != 'skipped'
        continue-on-error: true
        run: make generate-types PROVIDER="${{ matrix.provider }}"

      - name: Format code after mechanical repair
        id: post_repair_fmt
        if: always() && steps.mechanical_repair.outcome != 'skipped'
        continue-on-error: true
        run: cargo fmt --all

      - name: Run focused provider tests after mechanical repair
        id: post_repair_provider_tests
        if: always() && steps.mechanical_repair.outcome != 'skipped'
        continue-on-error: true
        run: cargo test -p lingua "${{ matrix.provider }}"

      - name: Run generator tests after mechanical repair
        id: post_repair_generator_tests
        if: always() && steps.mechanical_repair.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- crates/generate-types)" ]; then
            echo "Generator sources are unchanged; no generator tests required."
            exit 0
          fi
          cargo test -p generate-types

      - name: Validate build after mechanical repair
        id: post_repair_build
        if: always() && steps.mechanical_repair.outcome != 'skipped'
        continue-on-error: true
        run: cargo build --all-features

      - name: Run clippy after mechanical repair
        id: post_repair_clippy
        if: always() && steps.mechanical_repair.outcome != 'skipped'
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check mechanical validation result
        id: mechanical_validation
        if: always() && steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          failures=()

          require_success() {
            if [ "$2" != "success" ]; then
              failures+=("$1: $2")
            fi
          }

          if [ "${{ steps.mechanical_repair.outcome }}" = "skipped" ]; then
            echo "source=initial" >> "$GITHUB_OUTPUT"
            require_success "Rust provider regeneration" "${{ steps.post_implementation_provider_types.outcome }}"
            require_success "path policy" "${{ steps.path_policy.outcome }}"
            require_success "semantic policy" "${{ steps.semantic_policy.outcome }}"
            require_success "TypeScript regeneration" "${{ steps.post_implementation_ts_types.outcome }}"
            require_success "formatting" "${{ steps.fmt.outcome }}"
            require_success "provider tests" "${{ steps.provider_tests.outcome }}"
            require_success "generator tests" "${{ steps.generator_tests.outcome }}"
            require_success "build" "${{ steps.build.outcome }}"
            require_success "clippy" "${{ steps.clippy.outcome }}"
          else
            echo "source=post-repair" >> "$GITHUB_OUTPUT"
            require_success "mechanical repair action" "${{ steps.mechanical_repair.outcome }}"
            require_success "Rust provider regeneration" "${{ steps.post_repair_provider_types.outcome }}"
            require_success "path policy" "${{ steps.post_repair_path_policy.outcome }}"
            require_success "semantic policy" "${{ steps.post_repair_semantic_policy.outcome }}"
            require_success "TypeScript regeneration" "${{ steps.post_repair_ts_types.outcome }}"
            require_success "formatting" "${{ steps.post_repair_fmt.outcome }}"
            require_success "provider tests" "${{ steps.post_repair_provider_tests.outcome }}"
            require_success "generator tests" "${{ steps.post_repair_generator_tests.outcome }}"
            require_success "build" "${{ steps.post_repair_build.outcome }}"
            require_success "clippy" "${{ steps.post_repair_clippy.outcome }}"
          fi

          if [ "${#failures[@]}" -ne 0 ]; then
            echo "::error::Mechanical provider validation failed"
            printf '  - %s\n' "${failures[@]}"
            exit 1
          fi

          echo "Mechanical provider validation passed."

      - name: Build Lingua WASM for payload validation
        id: lingua_wasm
        if: >-
          steps.changes.outputs.has_changes == 'true' &&
          steps.mechanical_validation.outcome == 'success'
        continue-on-error: true
        run: make lingua-wasm

      - name: Extract unblocked payload capture cases
        id: capture_cases
        if: steps.post_implementation_plan.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          cases=$(node .github/scripts/provider-type-update-plan.mjs capture-cases \
            "$RUNNER_TEMP/provider-type-update-plan.json" "${{ matrix.provider }}")
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

      - name: Live capture OpenAI cases
        id: live_capture_openai
        if: >-
          matrix.provider == 'openai' &&
          steps.lingua_wasm.outcome == 'success' &&
          steps.capture_cases.outcome == 'success' &&
          steps.capture_cases.outputs.cases != ''
        continue-on-error: true
        env:
          CAPTURE_CASES: ${{ steps.capture_cases.outputs.cases }}
          OPENAI_API_KEY: ${{ secrets.LINGUA_CAPTURE_OPENAI_API_KEY }}
        run: pnpm --dir payloads capture --force --snapshots-only --providers chat-completions,responses --cases "$CAPTURE_CASES"

      - name: Live capture Anthropic cases
        id: live_capture_anthropic
        if: >-
          matrix.provider == 'anthropic' &&
          steps.lingua_wasm.outcome == 'success' &&
          steps.capture_cases.outcome == 'success' &&
          steps.capture_cases.outputs.cases != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.LINGUA_CAPTURE_ANTHROPIC_API_KEY }}
          CAPTURE_CASES: ${{ steps.capture_cases.outputs.cases }}
        run: pnpm --dir payloads capture --force --snapshots-only --providers anthropic --cases "$CAPTURE_CASES"

      - name: Live capture Google cases
        id: live_capture_google
        if: >-
          matrix.provider == 'google' &&
          steps.lingua_wasm.outcome == 'success' &&
          steps.capture_cases.outcome == 'success' &&
          steps.capture_cases.outputs.cases != ''
        continue-on-error: true
        env:
          CAPTURE_CASES: ${{ steps.capture_cases.outputs.cases }}
          GOOGLE_API_KEY: ${{ secrets.LINGUA_CAPTURE_GOOGLE_API_KEY }}
        run: pnpm --dir payloads capture --force --snapshots-only --providers google --cases "$CAPTURE_CASES"

      - name: Capture planned cross-provider transforms
        id: transform_capture
        if: >-
          steps.lingua_wasm.outcome == 'success' &&
          steps.capture_cases.outcome == 'success' &&
          steps.capture_cases.outputs.cases != '' &&
          (
            (matrix.provider == 'openai' && steps.live_capture_openai.outcome == 'success') ||
            (matrix.provider == 'anthropic' && steps.live_capture_anthropic.outcome == 'success') ||
            (matrix.provider == 'google' && steps.live_capture_google.outcome == 'success')
          )
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.LINGUA_CAPTURE_ANTHROPIC_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.LINGUA_CAPTURE_AWS_BEARER_TOKEN_BEDROCK }}
          CAPTURE_CASES: ${{ steps.capture_cases.outputs.cases }}
          GOOGLE_API_KEY: ${{ secrets.LINGUA_CAPTURE_GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.LINGUA_CAPTURE_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          capture_providers=()
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            capture_providers+=(anthropic)
          fi
          if [ -n "${AWS_BEARER_TOKEN_BEDROCK:-}" ]; then
            capture_providers+=(bedrock)
          fi
          if [ -n "${GOOGLE_API_KEY:-}" ]; then
            capture_providers+=(google)
          fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            capture_providers+=(chat-completions responses)
          fi

          if [ "${#capture_providers[@]}" -eq 0 ]; then
            echo "No transform capture credentials are configured; skipping transform capture."
            exit 0
          fi

          capture_provider_list=$(IFS=,; echo "${capture_providers[*]}")
          echo "Capturing transforms with credentialed providers: $capture_provider_list"
          make capture-transforms \
            CASES="$CAPTURE_CASES" \
            CAPTURE_PROVIDERS="$capture_provider_list" \
            FORCE=1

      - name: Verify payload fixture sync
        id: payload_sync
        if: >-
          steps.changes.outputs.has_changes == 'true' &&
          steps.mechanical_validation.outcome == 'success'
        continue-on-error: true
        run: pnpm --dir payloads exec vitest run scripts/sync.test.ts

      - name: Run payload transform checks
        id: payload_tests
        if: >-
          steps.changes.outputs.has_changes == 'true' &&
          steps.mechanical_validation.outcome == 'success'
        continue-on-error: true
        run: make test-payloads

      - name: Check typed boundaries
        id: typed_boundary
        if: >-
          steps.changes.outputs.has_changes == 'true' &&
          steps.mechanical_validation.outcome == 'success'
        continue-on-error: true
        run: make typed-boundary-check

      - name: Run cross-provider transform guard
        id: cross_provider
        if: >-
          steps.changes.outputs.has_changes == 'true' &&
          steps.mechanical_validation.outcome == 'success'
        continue-on-error: true
        run: cargo test -p coverage-report --test cross_provider_test cross_provider_transformations_have_no_unexpected_failures

      - name: Snapshot Braintrust trace for verification
        id: integration_verification_task_trace
        if: >-
          steps.stage_plan.outcome == 'success' &&
          steps.post_implementation_plan.outcome == 'success' &&
          steps.mechanical_validation.outcome == 'success'
        continue-on-error: true
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_PROJECT: lingua-provider-type-updates
          BRAINTRUST_PARENT_SPAN_ID: ${{ steps.braintrust_trace.outputs.span_id }}
          BRAINTRUST_ROOT_SPAN_ID: ${{ steps.braintrust_trace.outputs.root_span_id }}
          PROVIDER: ${{ matrix.provider }}
          TRACE_PHASE: verify generated provider integration
        run: |
          set -euo pipefail
          NODE_PATH="$(npm root -g)" node .github/scripts/braintrust-provider-types.mjs create-task-trace

      - name: Verify generated provider integration
        id: integration_verification
        if: >-
          steps.stage_plan.outcome == 'success' &&
          steps.post_implementation_plan.outcome == 'success' &&
          steps.mechanical_validation.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        uses: ./.github/actions/claude-code-with-retry
        with:
          anthropic_api_key: ${{ secrets.BRAINTRUST_API_KEY }}
          github_token: ${{ github.token }}
          display_report: "false"
          retry_on_failure: "false"
          plugin_marketplaces: |
            https://github.com/braintrustdata/braintrust-claude-plugin.git
          plugins: |
            trace-claude-code@braintrust-claude-plugin
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://gateway.staging.braintrust.dev",
                "ANTHROPIC_CUSTOM_HEADERS": "x-bt-project-name: automations-spend-control",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.BRAINTRUST_API_KEY }}",
                "TRACE_TO_BRAINTRUST": "${{ (steps.integration_verification_task_trace.outputs.root_span_id != '' || steps.braintrust_trace.outputs.root_span_id != '') && 'true' || 'false' }}",
                "BRAINTRUST_CC_PROJECT": "lingua-provider-type-updates",
                "BRAINTRUST_API_KEY": "${{ secrets.BRAINTRUST_API_KEY }}",
                "CC_PARENT_SPAN_ID": "${{ steps.integration_verification_task_trace.outputs.span_id || steps.braintrust_trace.outputs.span_id }}",
                "CC_ROOT_SPAN_ID": "${{ steps.integration_verification_task_trace.outputs.root_span_id || steps.braintrust_trace.outputs.root_span_id }}",
                "PROVIDER_UPDATE_PLAN_PATH": "${{ runner.temp }}/provider-type-update-plan.json",
                "PROVIDER_UPDATE_VERIFICATION_PATH": "${{ runner.temp }}/provider-type-update-verification.json",
                "BRAINTRUST_DEBUG": "false"
              }
            }
          claude_args: |
            --model claude-opus-5
            --max-turns 40
            --add-dir "${{ runner.temp }}"
            --tools "Skill,Read,Glob,Grep,LS,Bash,Write"
            --allowedTools "Skill,Read,Glob,Grep,LS,Write,Bash(git diff:*),Bash(git status:*),Bash(git show:*),Bash(git ls-files:*),Bash(ls:*),Bash(head:*),Bash(cat:*),Bash(grep:*)"
            --disallowedTools "Agent,Edit,WebSearch,WebFetch,MultiEdit,Replace,NotebookEditCell,mcp__github__create_issue,mcp__github__create_issue_comment,mcp__github__update_issue,mcp__github__create_pr,mcp__github__create_or_update_file,mcp__github__delete_file,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
          prompt: |
            This is the read-only verification phase for provider `${{ matrix.provider }}`.
            Invoke the `provider-type-update` skill and follow its verification
            phase. Read `$PROVIDER_UPDATE_PLAN_PATH`, inspect the complete final
            diff, and do not modify any tracked file.

            Validation outcomes:
            - plan has human blockers: `${{ steps.plan_validation.outputs.has_blockers }}`
            - unblocked payload capture cases: `${{ steps.capture_cases.outputs.cases }}`
            - bounded mechanical repair: `${{ steps.mechanical_repair.outcome }}`
            - mechanical validation source: `${{ steps.mechanical_validation.outputs.source }}`
            - effective Rust generation, path and semantic policies, TypeScript generation, formatting, focused provider tests, generator tests, build, and clippy: `${{ steps.mechanical_validation.outcome }}`
            - Lingua WASM build: `${{ steps.lingua_wasm.outcome }}`
            - live capture: openai `${{ steps.live_capture_openai.outcome }}`, anthropic `${{ steps.live_capture_anthropic.outcome }}`, google `${{ steps.live_capture_google.outcome }}`
            - payload transform capture: `${{ steps.transform_capture.outcome }}`
            - payload fixture sync: `${{ steps.payload_sync.outcome }}`
            - payload tests: `${{ steps.payload_tests.outcome }}`
            - typed boundary: `${{ steps.typed_boundary.outcome }}`
            - cross-provider guard: `${{ steps.cross_provider.outcome }}`

            Read `.github/scripts/provider-type-update-plan.mjs` for the exact
            verification schema. Write only the JSON report to
            `$PROVIDER_UPDATE_VERIFICATION_PATH`. A failed or skipped required
            validation is a blocking finding. Live and transform capture are
            required only when the unblocked payload capture case list is non-empty.
            Treat any new `provider_options` round-trip marker, opaque replay-only
            field, generated public-name collision, or leaked internal prefix such
            as `V1Main...` as blocking even if compilation succeeds.
            If the validated plan has human blockers, verify that every blocked
            change was left untouched and include those unresolved decisions as
            blocking findings with a `fail` verdict. That is the expected report
            for a safe needs-design draft; do not fail to write the report merely
            because the plan intentionally contains blockers.
            Prioritize completing the report:
            use the validated plan, final diff, and deterministic validation
            outcomes as primary evidence; inspect only files needed to resolve
            uncertainty. Do not repeat completed checks or exhaust the turn
            budget on optional exploration. Write the report as soon as every
            required schema field has sufficient evidence.

            Write the JSON file before responding. Your final response must be
            exactly `Wrote provider update verification.` Do not print the
            report, plan, diffs, or any other analysis in the final response.

      - name: Validate integration verification report
        id: verification_report
        if: >-
          steps.stage_plan.outcome == 'success' &&
          steps.post_implementation_plan.outcome == 'success' &&
          steps.mechanical_validation.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node .github/scripts/provider-type-update-plan.mjs verify-structure \
            "$RUNNER_TEMP/provider-type-update-verification.json" \
            "${{ matrix.provider }}"
          verdict=$(
            node .github/scripts/provider-type-update-plan.mjs verdict \
              "$RUNNER_TEMP/provider-type-update-verification.json" \
              "${{ matrix.provider }}"
          )
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Archive provider update patch
        id: update_patch
        if: >-
          always() &&
          steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --binary --full-index > "$RUNNER_TEMP/provider-type-update.patch"
          test -s "$RUNNER_TEMP/provider-type-update.patch"
          git diff --cached --stat

      - name: Upload integration plan and verification
        id: update_artifact
        if: always() && steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-type-integration-${{ matrix.provider }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/provider-type-update-plan.json
            ${{ runner.temp }}/provider-type-update-verification.json
            ${{ runner.temp }}/provider-type-update.patch
          if-no-files-found: warn
          retention-days: 14

      - name: Assess publication safety and mode
        id: publication_readiness
        if: always() && steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          hard_failures=()
          review_reasons=()

          require_safe() {
            if [ "$2" != "success" ]; then
              hard_failures+=("$1: $2")
            fi
          }

          require_ready() {
            if [ "$2" != "success" ]; then
              review_reasons+=("$1: $2")
            fi
          }

          if [ "${{ steps.mechanical_repair.outcome }}" = "skipped" ]; then
            require_safe "provider update path policy" "${{ steps.path_policy.outcome }}"
            require_ready "provider semantic policy" "${{ steps.semantic_policy.outcome }}"
          else
            require_safe "provider update path policy" "${{ steps.post_repair_path_policy.outcome }}"
            require_ready "provider semantic policy" "${{ steps.post_repair_semantic_policy.outcome }}"
          fi
          require_safe "recoverable patch" "${{ steps.update_patch.outcome }}"

          if [ "${{ steps.generate.outcome }}" != "success" ] &&
            [ "${{ steps.retry.outcome }}" != "success" ]; then
            require_ready "provider generation after repair" "${{ steps.repair_retry.outcome }}"
          fi
          require_ready "mechanical validation" "${{ steps.mechanical_validation.outcome }}"
          require_ready "Lingua WASM build" "${{ steps.lingua_wasm.outcome }}"
          require_ready "payload fixture sync" "${{ steps.payload_sync.outcome }}"
          require_ready "payload tests" "${{ steps.payload_tests.outcome }}"
          require_ready "typed boundary check" "${{ steps.typed_boundary.outcome }}"
          require_ready "cross-provider guard" "${{ steps.cross_provider.outcome }}"
          require_ready "patch artifact upload" "${{ steps.update_artifact.outcome }}"

          if [ -n "${{ steps.capture_cases.outputs.cases }}" ]; then
            require_ready "payload transform capture" "${{ steps.transform_capture.outcome }}"
            case "${{ matrix.provider }}" in
              openai)
                require_ready "OpenAI live capture" "${{ steps.live_capture_openai.outcome }}"
                ;;
              anthropic)
                require_ready "Anthropic live capture" "${{ steps.live_capture_anthropic.outcome }}"
                ;;
              google)
                require_ready "Google live capture" "${{ steps.live_capture_google.outcome }}"
                ;;
            esac
          fi

          for advisory in \
            "integration plan:${{ steps.plan_validation.outcome }}" \
            "plan staging:${{ steps.stage_plan.outcome }}" \
            "immutable plan:${{ steps.post_implementation_plan.outcome }}" \
            "verification report:${{ steps.verification_report.outcome }}"; do
            name="${advisory%%:*}"
            outcome="${advisory#*:}"
            require_ready "$name" "$outcome"
          done
          if [ "${{ steps.verification_report.outputs.verdict }}" != "pass" ]; then
            review_reasons+=("verification verdict: ${{ steps.verification_report.outputs.verdict || 'unavailable' }}")
          fi
          if [ "${{ steps.plan_validation.outputs.has_blockers }}" = "true" ]; then
            review_reasons+=("human design blockers remain")
          fi

          if [ "${#hard_failures[@]}" -ne 0 ]; then
            echo "::error::Provider update patch is not safe to publish"
            printf '  - %s\n' "${hard_failures[@]}"
            exit 1
          fi

          mode="ready"
          if [ "${#review_reasons[@]}" -ne 0 ]; then
            mode="draft"
            echo "Provider update will be published as a continuation draft:"
            printf '  - %s\n' "${review_reasons[@]}"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Provider update is safe to publish as mode: $mode."

      - name: Build PR body
        if: >-
          steps.changes.outputs.has_changes == 'true' &&
          steps.publication_readiness.outcome == 'success'
        env:
          BRAINTRUST_PROJECT: lingua-provider-type-updates
          BRAINTRUST_ROOT_SPAN_ID: ${{ steps.braintrust_trace.outputs.root_span_id }}
          BRAINTRUST_SPAN_ID: ${{ steps.braintrust_trace.outputs.span_id }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          {
            if [ -n "$BRAINTRUST_ROOT_SPAN_ID" ] && [ -n "$BRAINTRUST_SPAN_ID" ]; then
              NODE_PATH="$(npm root -g)" node .github/scripts/braintrust-provider-types.mjs emit-pr-metadata ||
                echo "<!-- Braintrust metadata unavailable -->"
              echo
            fi
            echo "Automated update of Lingua provider types."
            echo
            echo "Provider: \`${{ matrix.provider }}\`"
            echo
            echo "Publication mode: \`${{ steps.publication_readiness.outputs.mode == 'draft' && 'needs-review draft' || 'ready' }}\`"
            echo
            if [ "${{ steps.publication_readiness.outputs.mode }}" = "draft" ]; then
              echo "## Continuation required"
              echo
              echo "This draft preserves the automation's partial work. One or more validation or advisory checks did not complete successfully; continue from this branch instead of restarting the provider update."
              echo
            fi
            echo "Feedback: comment \`/bt good\` or \`/bt bad\` to log review feedback to the Braintrust trace."
            echo
            if [ "${{ steps.plan_validation.outcome }}" = "success" ] && [ "${{ steps.plan_validation.outputs.has_blockers }}" = "true" ]; then
              node .github/scripts/provider-type-update-plan.mjs render-blockers \
                "$RUNNER_TEMP/provider-type-update-plan.json" \
                "${{ matrix.provider }}" ||
                echo "Human blocker details are available in the archived plan artifact."
              echo
              echo
            fi
            echo "**Validation**"
            echo
            echo "- \`./pipelines/generate-provider-types.sh ${{ matrix.provider }}\`: ${{ steps.generate.outcome }}"
            if [ "${{ steps.generate.outcome }}" = "failure" ]; then
              echo "- Deterministic generator retry: ${{ steps.retry.outcome }}"
            fi
            if [ "${{ steps.retry.outcome }}" = "failure" ]; then
              echo "- Claude repair pass: ${{ steps.repair.outcome }}"
              echo "- Generator after Claude repair: ${{ steps.repair_retry.outcome }}"
            fi
            echo "- \`make generate-types PROVIDER=${{ matrix.provider }}\`: ${{ steps.ts_types.outcome }}"
            echo "- Braintrust workflow trace: ${{ steps.braintrust_trace.outcome }}"
            echo "- Claude integration plan: ${{ steps.integration_plan.outcome }}"
            echo "- Structured plan validation: ${{ steps.plan_validation.outcome }}"
            echo "- Human design blockers: ${{ steps.plan_validation.outputs.has_blockers }}"
            echo "- Claude focused implementation: ${{ steps.integration_implementation.outcome }}"
            echo "- Immutable plan revalidation: ${{ steps.post_implementation_plan.outcome }}"
            echo "- Initial post-implementation Rust regeneration: ${{ steps.post_implementation_provider_types.outcome }}"
            echo "- Initial provider update path policy: ${{ steps.path_policy.outcome }}"
            echo "- Initial provider semantic policy: ${{ steps.semantic_policy.outcome }}"
            echo "- Initial post-implementation TypeScript regeneration: ${{ steps.post_implementation_ts_types.outcome }}"
            echo "- Initial formatting: ${{ steps.fmt.outcome }}"
            echo "- Initial focused provider tests: ${{ steps.provider_tests.outcome }}"
            echo "- Initial conditional generator tests: ${{ steps.generator_tests.outcome }}"
            echo "- Initial build: ${{ steps.build.outcome }}"
            echo "- Initial clippy: ${{ steps.clippy.outcome }}"
            echo "- Bounded Claude mechanical repair: ${{ steps.mechanical_repair.outcome }}"
            echo "- Effective mechanical validation source: ${{ steps.mechanical_validation.outputs.source }}"
            echo "- Effective mechanical validation: ${{ steps.mechanical_validation.outcome }}"
            echo "- \`make lingua-wasm\`: ${{ steps.lingua_wasm.outcome }}"
            echo "- Unblocked payload capture cases: \`${{ steps.capture_cases.outputs.cases }}\`"
            echo "- Live capture (OpenAI): ${{ steps.live_capture_openai.outcome }}"
            echo "- Live capture (Anthropic): ${{ steps.live_capture_anthropic.outcome }}"
            echo "- Live capture (Google): ${{ steps.live_capture_google.outcome }}"
            echo "- Payload cross-provider transform capture: ${{ steps.transform_capture.outcome }}"
            echo "- Payload fixture sync: ${{ steps.payload_sync.outcome }}"
            echo "- \`make test-payloads\`: ${{ steps.payload_tests.outcome }}"
            echo "- \`make typed-boundary-check\`: ${{ steps.typed_boundary.outcome }}"
            echo "- \`cargo test -p coverage-report --test cross_provider_test cross_provider_transformations_have_no_unexpected_failures\`: ${{ steps.cross_provider.outcome }}"
            echo "- Claude read-only verification: ${{ steps.integration_verification.outcome }}"
            echo "- Verification report validation: ${{ steps.verification_report.outcome }}"
            echo "- Verification verdict: ${{ steps.verification_report.outputs.verdict }}"
            echo "- Recoverable binary patch archive: ${{ steps.update_patch.outcome }}"
            echo "- Patch artifact upload: ${{ steps.update_artifact.outcome }}"
            echo
            echo "Only safely scoped patches with a locally archived binary diff are published. Any incomplete AI phase or failed deterministic check produces a needs-review draft so work can continue from the PR branch."
          } > "$RUNNER_TEMP/update-provider-types-pr-body.md"

      - name: Create or update continuation PR
        id: create_pr
        if: >-
          steps.changes.outputs.has_changes == 'true' &&
          steps.publication_readiness.outcome == 'success'
        continue-on-error: true
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ github.token }}
          base: ${{ github.ref_name }}
          branch: ${{ steps.branch.outputs.name }}
          commit-message: "Update ${{ matrix.provider }} provider types"
          title: "${{ steps.publication_readiness.outputs.mode == 'draft' && '[Needs review] ' || '' }}Update ${{ matrix.provider }} provider types"
          body-path: ${{ runner.temp }}/update-provider-types-pr-body.md
          labels: ${{ steps.publication_readiness.outputs.mode == 'ready' && 'auto-sync' || '' }}
          draft: ${{ steps.publication_readiness.outputs.mode == 'draft' }}
          delete-branch: true
          signoff: false

      - name: Retry continuation PR publication
        id: create_pr_retry
        if: steps.create_pr.outcome == 'failure'
        continue-on-error: true
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ github.token }}
          base: ${{ github.ref_name }}
          branch: ${{ steps.branch.outputs.name }}
          commit-message: "Update ${{ matrix.provider }} provider types"
          title: "${{ steps.publication_readiness.outputs.mode == 'draft' && '[Needs review] ' || '' }}Update ${{ matrix.provider }} provider types"
          body-path: ${{ runner.temp }}/update-provider-types-pr-body.md
          labels: ${{ steps.publication_readiness.outputs.mode == 'ready' && 'auto-sync' || '' }}
          draft: ${{ steps.publication_readiness.outputs.mode == 'draft' }}
          delete-branch: true
          signoff: false

      - name: Fail workflow if validation failed
        if: >-
          (
            (
              steps.changes.outputs.has_changes != 'true' &&
              steps.generate.outcome == 'failure' &&
              steps.retry.outcome != 'success' &&
              steps.repair_retry.outcome != 'success'
            ) ||
            (
              steps.changes.outputs.has_changes == 'true' &&
              (
                steps.publication_readiness.outcome != 'success' ||
                (
                  steps.create_pr.outcome != 'success' &&
                  steps.create_pr_retry.outcome != 'success'
                )
              )
            )
          )
        run: |
          echo "Provider type update could not publish a safely scoped recovery PR." >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.create_pr.outcome }}" = "success" ] ||
            [ "${{ steps.create_pr_retry.outcome }}" = "success" ]; then
            echo "Provider types changed and were published in ${{ steps.publication_readiness.outputs.mode }} mode."
          elif [ "${{ steps.publication_readiness.outcome }}" = "success" ]; then
            echo "Provider patch was safe to publish, but both PR publication attempts failed. Use the archived patch to recover the work."
          elif [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
            echo "Provider types changed but failed the hard publication safety checks. Download the archived patch if it was created."
          elif [ "${{ steps.generate.outcome }}" = "failure" ]; then
            echo "Provider types are unchanged after a recovered generation failure."
          else
            echo "Provider types are already up to date."
          fi
